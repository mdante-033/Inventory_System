name: PHP Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, openssl
          coverage: none

      - name: Check PHP version
        run: php --version

      - name: Check PostgreSQL connection
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d inventory_test -c "SELECT version();"

      - name: Validate PHP syntax (all files)
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./.git/*" \
            | xargs -r php -l

      - name: Check critical files exist
        run: |
          files=(
            "index.php"
            "admin.php"
            "login.php"
            "db_connect.php"
            "luxestore.php"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing

      - name: Check modules directory
        run: |
          modules=(
            "modules/dashboard.php"
            "modules/products.php"
            "modules/inventory.php"
            "modules/orders.php"
            "modules/customers.php"
            "modules/suppliers.php"
            "modules/reports.php"
            "modules/settings.php"
          )
          missing=0
          for f in "${modules[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          exit $missing
