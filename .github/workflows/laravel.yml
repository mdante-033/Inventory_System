name: PHP Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, openssl
          coverage: none

      - name: Check PHP version
        run: php --version

      - name: Check PostgreSQL connection
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d inventory_test -c "SELECT version();"

      - name: Validate PHP syntax
        run: |
          echo "Scanning all PHP files for syntax errors..."
          failed=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1)
            if echo "$output" | grep -q "Errors parsing\|Parse error"; then
              echo "SYNTAX ERROR: $file"
              echo "$output"
              failed=1
            else
              echo "OK: $file"
            fi
          done < <(find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*" -print0)
          if [ $failed -eq 1 ]; then
            echo ""
            echo "One or more PHP files have syntax errors. Fix them before merging."
            exit 1
          fi
          echo ""
          echo "All PHP files passed syntax check."

      - name: Check critical files exist
        run: |
          missing=0
          for f in index.php admin.php login.php db_connect.php luxestore.php; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Check module files exist
        run: |
          missing=0
          for f in dashboard products inventory orders customers suppliers reports settings; do
            if [ -f "modules/${f}.php" ]; then
              echo "OK: modules/${f}.php"
            else
              echo "MISSING: modules/${f}.php"
              missing=1
            fi
          done
          exit $missing
