# render.yaml  –  MUST be lowercase filename, placed in project root
# This tells Render to build using the Dockerfile (Docker environment)

services:
  - type: web
    name: inventory-system
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_URL
        value: https://inventory-system-cigq.onrender.com
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_FROM_ADDR
        sync: false
      - key: SMTP_FROM_NAME
        value: Inventory System
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
